name: build-linux
# Fork-only: upstream publishes Windows releases; the directness corpus is
# exported on a Linux VPS. Builds and tests on Linux and uploads the binary.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - name: movement + export tests
        run: cargo +1.86.0 test --locked -p vrf-movement -p vrf-export --all-features
      - name: transform golden vectors
        run: cargo +1.86.0 test --locked -p vrf-transform
      - name: python interop (movement posture columns)
        run: |
          python3 -m pip install --quiet pyarrow
          export VRFKIT_INTEROP_DIR="$RUNNER_TEMP/vrfkit-interop"
          mkdir -p "$VRFKIT_INTEROP_DIR"
          cargo +1.86.0 test --locked -p vrf-export --all-features --test roundtrip write_interop_files
          python3 crates/vrf-export/tests/python_interop.py "$VRFKIT_INTEROP_DIR/interop"
      - name: build release
        run: cargo +1.86.0 build --release --locked -p vrfkit
      - uses: actions/upload-artifact@v4
        with:
          name: vrfkit-linux-x64
          path: target/release/vrfkit
          if-no-files-found: error
