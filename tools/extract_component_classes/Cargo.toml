[package]
name = "extract-component-classes"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"
publish = false

# Standalone, like tools/probe_offset: not a member of the root workspace, so it
# builds into its own target directory and its lockfile pins only what it uses.
# It reads the installed game, which nothing in `crates/` does.
[workspace]

[[bin]]
name = "extract-component-classes"
path = "src/main.rs"

[dependencies]
# The same decoder vrf-container uses for replay chunks, at the same version.
oozextract = "0.5.4"

[profile.release]
opt-level = 3
